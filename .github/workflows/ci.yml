name: CI

# Only runs for pull requests targeting main — never for direct pushes/commits
# to main itself (there is no `push` trigger here).
on:
  pull_request:
    branches: [main]

# Cancel superseded runs when new commits land on the same PR.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OraPgMigrator.slnx --locked-mode

      - name: Build
        run: dotnet build OraPgMigrator.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OraPgMigrator.slnx --configuration Release --no-build --verbosity normal

  publish-windows:
    name: Publish Windows binary
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Deliberately not --locked-mode / --no-restore here: PublishAot pulls
      # in Microsoft.DotNet.ILCompiler and Microsoft.NET.ILLink.Tasks as
      # implicit package references for this one RID, which restoring under
      # --locked-mode would require adding to packages.lock.json — but a
      # single-RID restore rewrites the lock file to that RID only, wiping
      # the osx-x64/osx-arm64/linux-x64 sections generated by the normal
      # multi-RID restore. Simplest correct fix: let this AOT toolchain
      # restore float (it's pinned to the SDK version anyway) and do it as
      # part of one implicit-restore publish, same as a local `dotnet
      # publish -r win-x64` would.
      - name: Publish win-x64 (Native AOT, single file)
        run: dotnet publish src/OraPgMigrator.Cli/OraPgMigrator.Cli.csproj -c Release -r win-x64 -o publish/win-x64

      - name: Upload orapg.exe
        uses: actions/upload-artifact@v7.0.1
        with:
          name: orapg-win-x64
          path: publish/win-x64/orapg.exe
          if-no-files-found: error
          retention-days: 1

  auto-merge:
    name: Enable auto-merge
    needs: [build-and-test, publish-windows]
    runs-on: ubuntu-latest
    # Skip draft PRs — they shouldn't be merged automatically.
    if: github.event.pull_request.draft == false
    steps:
      - name: Enable auto-merge for this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash \
            "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
